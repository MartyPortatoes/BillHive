<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>BillHive · Claim Your Share</title>
<style>
  :root {
    --bg:       #f4ecda;
    --surface:  #fbf5e8;
    --surface2: #ede1c6;
    --surface3: #e0d2b1;
    --border:   #d8c8a4;
    --border2:  #b8a578;
    --text:     #2b1d11;
    --text2:    #4a3826;
    --muted:    #7a6a52;
    --muted2:   #a08e72;
    --amber:    #d8923e;
    --honey-deep: #b8721e;
    --honey-soft: #f0c073;
    --red:      #a04a2e;
    --green:    #5b6f3f;
    --shadow:   rgba(73, 56, 38, 0.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 18px calc(var(--dock-height, 100px) + 24px);
  }

  /* ── Header ───────────────────────────────────────────────── */
  .brand {
    display: flex; align-items: center; gap: 8px;
    color: var(--honey-deep);
    font-weight: 600; font-size: 14px;
    margin-bottom: 22px;
  }
  .brand-hex {
    width: 18px; height: 18px;
    background: var(--amber);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  }

  h1.check-name {
    font-size: 28px; font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .check-date {
    color: var(--muted); font-size: 14px;
    margin-bottom: 24px;
  }

  /* ── Cards ────────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin: 0 0 18px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* ── Item rows ────────────────────────────────────────────── */
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .item + .item {
    border-top: 1px solid var(--border);
  }
  .item .check {
    flex: 0 0 26px; height: 26px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .item .check svg { display: none; }
  .item.on .check {
    background: var(--amber);
    border-color: var(--honey-deep);
  }
  .item.on .check svg {
    display: block;
    width: 16px; height: 16px;
    color: var(--text);
  }
  .item .name {
    flex: 1 1 auto;
    font-size: 15px; font-weight: 500;
  }
  .item .price {
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--text2);
  }
  .item.taken {
    opacity: 0.6;
  }
  .item.taken .name {
    text-decoration: line-through;
    text-decoration-color: var(--muted2);
  }
  .item-claimers {
    font-size: 11px; color: var(--muted);
    margin-left: 38px; margin-top: -4px; margin-bottom: 8px;
  }

  /* ── Totals strip ────────────────────────────────────────── */
  .totals {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 12px;
    background: var(--surface2);
    border-radius: 10px;
    margin-top: 8px;
  }
  .totals .col {
    text-align: center;
  }
  .totals .label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 2px;
  }
  .totals .val {
    font-size: 15px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .totals .col.your .val {
    color: var(--honey-deep);
    font-size: 18px;
  }

  /* ── Name field + button ─────────────────────────────────── */
  .name-row {
    display: flex; gap: 10px;
    margin-top: 12px;
  }
  input[type="text"] {
    flex: 1; min-width: 0;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--amber);
  }
  button.primary {
    background: var(--amber);
    border: 1px solid var(--honey-deep);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px; font-weight: 600;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
  }
  button.primary:hover { background: var(--honey-soft); }
  button.primary:active { transform: scale(0.97); }
  button.primary:disabled {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  button.full {
    display: block; width: 100%;
    margin-top: 12px;
  }

  /* ── Claims list ─────────────────────────────────────────── */
  .claims {
    margin-bottom: 18px;
  }
  .claim-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 8px 4px;
    font-size: 13px;
  }
  .claim-row + .claim-row {
    border-top: 1px solid var(--border);
  }
  .claim-row .who { font-weight: 600; color: var(--text2); }
  .claim-row .what { color: var(--muted); font-size: 12px; }

  /* ── States ──────────────────────────────────────────────── */
  .empty, .error {
    text-align: center; padding: 60px 24px;
  }
  .empty .icon, .error .icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
  .error .title { color: var(--red); font-weight: 600; margin-bottom: 4px; }
  .empty .title { color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .empty .body, .error .body { color: var(--muted); font-size: 14px; }

  .toast {
    position: fixed;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 22px;
    font-size: 14px; font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .toast.show { opacity: 1; }

  /* Dark mode tweaks — make readable on dark phones */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #221810;
      --surface:  #332618;
      --surface2: #332618;
      --surface3: #332618;
      --border:   #7a6442;
      --border2:  #8a7450;
      --text:     #f0e6d0;
      --text2:    #d4c5a0;
      --muted:    #a08e6e;
      --muted2:   #786750;
      --amber:    #7eb8d6;
      --honey-deep: #5497b8;
      --honey-soft: #b4d5e6;
      --red:      #c46a4a;
      --green:    #8aa468;
      --shadow:   rgba(0, 0, 0, 0.25);
    }
    button.primary { color: #0c0d0f; }
  }

  .action-dock { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border); }
  .action-dock button { display: block; width: 100%; max-width: 484px; margin: 0 auto; min-height: 48px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
  .tools button { padding: 10px 12px; min-height: 44px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 3px; }
  .item input { width: 24px; height: 24px; flex-shrink: 0; accent-color: var(--honey-deep); }
  .item { min-height: 48px; }
  .item .name, .claim-row .who, .claim-row .what { overflow-wrap: anywhere; }
  .check-name { overflow-wrap: anywhere; }
  .item .price { overflow-wrap: anywhere; }
  .claim-row { gap: 12px; flex-wrap: wrap; }
  .notice { color: var(--text2); line-height: 1.5; overflow-wrap: anywhere; }
  .problem { color: var(--red); }
  .state-message { min-height: 1.5em; margin: 12px 0; }
  .comparison h3 { font-size: 16px; margin: 12px 0 6px; }
  .comparison p { line-height: 1.4; overflow-wrap: anywhere; }
  label.name-label { display: block; margin-bottom: 8px; font-weight: 600; }
  [hidden] { display: none !important; }
  @media (max-width: 360px) { .item { gap: 8px; } .wrap { padding-left: 12px; padding-right: 12px; } }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="empty">
    <div class="icon">🐝</div>
    <div class="title">Loading…</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const match = location.pathname.match(/^(.*?)\/share\/[A-Za-z0-9_-]{16,128}\/?$/);
  const prefix = match && match[1];
  const root = document.getElementById('root');
  const failed = () => { root.textContent = 'This check page could not be opened. Reload the complete link sent by the host.'; };
  if (prefix == null || prefix && (!/^\/(?:[A-Za-z0-9._~-]+\/)*[A-Za-z0-9._~-]+$/.test(prefix) || prefix.split('/').some(p => p === '.' || p === '..'))) { failed(); return; }
  const client = document.createElement('script'); client.src = prefix + '/check-claim-client.js'; client.onerror = failed;
  client.onload = () => { const page = document.createElement('script'); page.src = prefix + '/check-claim-page.js'; page.onerror = failed; document.head.append(page); };
  document.head.append(client);
})();
</script>
</body>
</html>
